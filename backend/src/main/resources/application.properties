spring.application.name=backend

# ---------- H2 数据库（文件模式：数据持久化到 backend/data/ 目录） ----------
spring.datasource.url=jdbc:h2:file:./data/kanban
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ---------- H2 控制台（浏览器可视化查看数据库） ----------
# 启动后端后，浏览器打开 http://localhost:8080/h2-console
# JDBC URL 填：jdbc:h2:file:./data/kanban
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------- JPA ----------
# update：每次启动自动检查并更新表结构（不会删已有数据）
spring.jpa.hibernate.ddl-auto=update
# 在控制台打印实际执行的 SQL，方便学习观察
spring.jpa.show-sql=true
